<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tracker Compact</title>

    <!-- SCRIPT CSS TAMBAHAN DISISIPKAN DI SINI (BIAR PAS DI HP) -->
    <style>
        * {
            box-sizing: border-box !important;
        }
        body {
            margin: 0 !important;
            padding: 10px !important;
            background-color: #0d1117 !important; 
            color: #c9d1d9 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            overflow-x: hidden; 
        }
        .container {
            width: 100% !important;
            max-width: 450px !important; 
            background-color: #161b22 !important; 
            border: 1px solid #30363d !important;
            border-radius: 12px !important;
            padding: 15px !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5) !important;
        }
        h3 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 18px;
            letter-spacing: 0.5px;
        }
        .grid-inputs {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 10px !important;
            margin-bottom: 15px !important;
        }
        .input-group.full-width {
            grid-column: span 2 !important;
        }
        .input-group label {
            display: block !important;
            font-size: 11px !important;
            color: #8b949e !important;
            margin-bottom: 4px !important;
        }
        .input-group input {
            width: 100% !important;
            background-color: #21262d !important;
            border: 1px solid #30363d !important;
            color: #ffffff !important;
            padding: 8px 10px !important;
            border-radius: 6px !important;
            font-size: 13px !important;
            outline: none;
        }
        .input-group input:focus {
            border-color: #58a6ff !important;
        }
        .btn-group {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 8px !important;
            margin-top: 15px !important;
        }
        .btn-group button {
            padding: 10px 5px !important;
            border-radius: 6px !important;
            border: none !important;
            font-size: 12px !important;
            font-weight: bold !important;
            cursor: pointer;
            color: white;
        }
        .btn-calc { background-color: #d97706 !important; color: black !important; }
        .btn-wa { background-color: #16a34a !important; }
        .btn-reset { background-color: #dc2626 !important; }
        .bar-flex-container-main {
            display: flex !important;
            width: 100% !important;
            border-radius: 6px !important;
            overflow: hidden !important;
            margin: 12px 0 !important;
            font-size: 11px !important;
            font-weight: bold !important;
            text-align: center !important;
        }
        .bar-main-fill {
            padding: 6px 0 !important;
        }
        .profit-color { background-color: #16a34a !important; width: 50%; }
        .loss-color { background-color: #dc2626 !important; width: 50%; }
        .table-res {
            width: 100% !important;
            border-collapse: collapse !important;
            font-size: 12px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Crypto Pivot Tracker</h3>
    
    <div class="grid-inputs">
        <div class="input-group full-width row-layout">
            <label for="hb">Harga Bergerak (HB)</label>
            <input type="text" id="hb" value="1.474.500.000" oninput="formatInputRupiah(this)">
        </div>
        <div class="input-group">
            <label for="r2">Resisten 2 (R2)</label>
            <input type="text" id="r2" value="1.524.523.010" oninput="formatInputRupiah(this)">
        </div>
        <div class="input-group">
            <label for="r1">Resisten 1 (R1)</label>
            <input type="text" id="r1" value="1.489.000.000" oninput="formatInputRupiah(this)">
        </div>
        <div class="input-group">
            <label for="s1">Support 1 (S1)</label>
            <input type="text" id="s1" value="1.460.118.020" oninput="formatInputRupiah(this)">
        </div>
        <div class="input-group">
            <label for="s2">Support 2 (S2)</label>
            <input type="text" id="s2" value="1.450.000.000" oninput="formatInputRupiah(this)">
        </div>
    </div>

    <!-- ACCORDION 1: ANALISIS JARAK -->
    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion('acc-jarak', 'panah-jarak')">
            <span>📊 Analisis Jarak & Persentase</span>
            <span id="panah-jarak" class="panah-icon">▼</span>
        </div>
        <div id="acc-jarak" class="accordion-content">
            <table class="table-res">
                <thead>
                    <tr><th>Target</th><th>Jarak</th><th>Visual % & Bar</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="pos-r">R2</td><td id="dist-r2">-</td>
                        <td>
                            <div id="pct-r2">-</div>
                            <div class="sub-bar-container"><div id="bar-r2" class="sub-bar-fill"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td class="pos-r">R1</td><td id="dist-r1">-</td>
                        <td>
                            <div id="pct-r1">-</div>
                            <div class="sub-bar-container"><div id="bar-r1" class="sub-bar-fill"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td class="pos-s">S1</td><td id="dist-s1">-</td>
                        <td>
                            <div id="pct-s1">-</div>
                            <div class="sub-bar-container"><div id="bar-s1" class="sub-bar-fill"></div></div>
                        </td>
                    </tr>
                    <tr>
                        <td class="pos-s">S2</td><td id="dist-s2">-</td>
                        <td>
                            <div id="pct-s2">-</div>
                            <div class="sub-bar-container"><div id="bar-s2" class="sub-bar-fill"></div></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ACCORDION 2: RENCANA POSISI -->
    <div class="accordion-item">
        <div class="accordion-header" onclick="toggleAccordion('acc-posisi', 'panah-posisi')">
            <span>🎯 Rencana Posisi Bertingkat</span>
            <span id="panah-posisi" class="panah-icon">▼</span>
        </div>
        <div id="acc-posisi" class="accordion-content">
            <table class="table-res">
                <thead>
                    <tr><th>Aksi</th><th>Target Harga</th><th>Ket.</th></tr>
                </thead>
                <tbody>
                    <tr><td class="pos-r">Jual 3</td><td id="jual-3">-</td><td class="info-text">Maks R2</td></tr>
                    <tr><td class="pos-r">Jual 2</td><td id="jual-2">-</td><td class="info-text">Tengah</td></tr>
                    <tr><td class="pos-r">Jual 1</td><td id="jual-1">-</td><td class="info-text">R1</td></tr>
                    <tr style="border-top: 1px dashed var(--border-color);">
                        <td class="pos-s">Beli 1</td><td id="beli-1">-</td><td class="info-text">>S1</td></tr>
                    <tr><td class="pos-s">Beli 2</td><td id="beli-2">-</td><td class="info-text">S1</td></tr>
                    <tr><td class="pos-s">Beli 3</td><td id="beli-3">-</td><td class="info-text">S2</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="summary-text" id="summary">
        Masukkan data lalu ketuk Simpan/Hitung.
    </div>

    <!-- PENGATURAN BAR BARU DI ATAS TOMBOL -->
    <div class="bar-flex-container-main">
        <div id="main-bar-profit" class="bar-main-fill profit-color">PROFIT (50%)</div>
        <div id="main-bar-loss" class="bar-main-fill loss-color">RISK (50%)</div>
    </div>

    <div class="btn-group">
        <button class="btn-calc" onclick="hitungData()">Simpan/Hitung</button>
        <button class="btn-wa" onclick="kirimWA()">Kirim WA</button>
        <button class="btn-reset" onclick="resetForm()">Reset</button>
    </div>
</div>

</body>
</html>



<style>
    :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --border-color: #30363d;
        --text-main: #c9d1d9;
        --text-muted: #8b949e;
        --accent-green: #238636;
        --accent-red: #da3633;
        --accent-blue: #1f6feb;
        --table-header-bg: #21262d; 
        --text-soft-white: #e0e6ed; 
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2px; 
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 400px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 8px; 
        box-sizing: border-box;
    }

    h3 {
        margin: 0 0 8px 0;
        text-align: center;
        font-size: 0.9rem;
        color: #ffffff;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 3px;
    }

    .grid-inputs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        margin-bottom: 6px;
    }

    .input-group { display: flex; flex-direction: column; }
    .input-group.full-width { grid-column: span 2; }
    
    .row-layout {
        flex-direction: row !important;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 2px;
    }
    .row-layout label { margin-bottom: 0; white-space: nowrap; }
    .row-layout input { flex-grow: 1; text-align: right; }

    label {
        font-size: 0.65rem;
        color: var(--text-muted);
        margin-bottom: 1px;
        font-weight: 600;
    }

    input {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        color: #ffffff;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 0.75rem;
        outline: none;
    }

    .accordion-item {
        border: 1px solid var(--border-color);
        border-radius: 4px;
        margin-bottom: 4px;
        overflow: hidden;
    }

    .accordion-header {
        background: #21262d;
        color: #ffffff;
        padding: 5px 8px;
        font-size: 0.7rem;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
    }

    .panah-icon {
        color: #2196f3;
        font-size: 9px;
        transition: transform 0.3s ease;
        transform: rotate(0deg);
    }

    .accordion-content {
        display: none;
        background: #000000; 
        padding: 2px 4px;
        width: 100%;
        box-sizing: border-box;
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
    }

    .table-res {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.7rem;
        margin: 0;
    }

    .table-res thead th {
        background-color: var(--table-header-bg);
        color: var(--text-soft-white);
        font-weight: bold;
    }

    .table-res th, .table-res td {
        padding: 3px 5px; 
        text-align: left;
        border-bottom: 1px solid var(--border-color);
        vertical-align: middle;
    }

    .pos-r { color: var(--accent-red); font-weight: 600; }
    .pos-s { color: var(--accent-green); font-weight: 600; }
    .info-text { color: var(--text-muted); font-size: 0.65rem; }

    .sub-bar-container {
        width: 100%;
        background-color: #222;
        border-radius: 3px;
        height: 4px;
        margin-top: 2px;
        overflow: hidden;
    }

    .sub-bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 3px;
        transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* CSS BAR BARU: Membuat Progress Bar Utama Sejajar di Atas Tombol */
    .bar-flex-container-main {
        display: flex;
        width: 100%;
        height: 16px;
        border-radius: 4px;
        overflow: hidden;
        margin: 6px 0;
        font-size: 0.62rem;
        font-weight: bold;
        text-align: center;
        line-height: 16px;
        color: #ffffff;
    }

    .bar-main-fill { transition: width 0.3s ease; }
    .profit-color { background-color: var(--accent-green); }
    .loss-color { background-color: var(--accent-red); }

    .summary-text {
        margin: 4px 0;
        font-size: 0.7rem;
        background: var(--bg-color);
        padding: 4px 6px;
        border-radius: 4px;
        border-left: 3px solid var(--accent-blue);
        line-height: 1.2;
    }

    .btn-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 6px;
    }

    button {
        padding: 5px;
        border: none;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: bold;
        cursor: pointer;
        color: #ffffff;
    }

    .btn-calc { background-color: var(--accent-blue); }
    .btn-wa { background-color: var(--accent-green); }
    .btn-reset { background-color: #21262d; border: 1px solid var(--border-color); color: var(--text-main); }
</style>


<script>
    function toggleAccordion(contentId, panahId) {
        const content = document.getElementById(contentId);
        const panah = document.getElementById(panahId);
        if (content.style.display === "table" || content.style.display === "block") {
            content.style.display = "none";
            panah.style.transform = "rotate(0deg)";
        } else {
            content.style.display = "table"; 
            panah.style.transform = "rotate(-180deg)";
        }
    }

    function formatInputRupiah(input) {
        let value = input.value.replace(/\D/g, ""); 
        if (value === "") {
            input.value = "";
            return;
        }
        input.value = new Intl.NumberFormat('id-ID').format(value);
        hitungData(); 
    }

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(angka);
    }

    function dapatkanAngkaMurni(id) {
        const textVal = document.getElementById(id).value;
        return parseFloat(textVal.replace(/\./g, "")) || 0;
    }

    function hitungData() {
        const hb = dapatkanAngkaMurni('hb');
        const r2 = dapatkanAngkaMurni('r2');
        const r1 = dapatkanAngkaMurni('r1');
        const s1 = dapatkanAngkaMurni('s1');
        const s2 = dapatkanAngkaMurni('s2');

        if (!hb) return;

        const targets = [
            { id: 'r2', val: r2, tipe: 'R' },
            { id: 'r1', val: r1, tipe: 'R' },
            { id: 's1', val: s1, tipe: 'S' },
            { id: 's2', val: s2, tipe: 'S' }
        ];

        let pctAbsolutR1 = 0;
        let pctAbsolutS1 = 0;

        targets.forEach(t => {
            const distAbsolut = Math.abs(t.val - hb);
            let pct = ((t.val - hb) / hb) * 100;
            
            if (t.tipe === 'R' && pct < 0) pct = pct; 
            if (t.tipe === 'S' && pct > 0) pct = -pct; 

            const sign = pct >= 0 ? "+" : "";
            const pctAbsolut = Math.abs(pct);
            
            if (t.id === 'r1') pctAbsolutR1 = pctAbsolut;
            if (t.id === 's1') pctAbsolutS1 = pctAbsolut;

            const cellPct = document.getElementById(`pct-${t.id}`);
            const barFill = document.getElementById(`bar-${t.id}`);
            
            document.getElementById(`dist-${t.id}`).innerText = formatRupiah(distAbsolut);
            
            let colorHex = "";
            let emojiStatus = "";
            
            if (pctAbsolut <= 0.30) {
                colorHex = "#da3633"; 
                emojiStatus = "🔴";
            } else if (pctAbsolut > 0.30 && pctAbsolut <= 0.60) {
                colorHex = "#ff9800"; 
                emojiStatus = "🟡";
            } else {
                colorHex = "#238636"; 
                emojiStatus = "🟢";
            }
            
            cellPct.innerText = `${emojiStatus} ${sign}${pct.toFixed(2)}%`;
            cellPct.style.color = colorHex;

            let lebarBar = (pctAbsolut / 5) * 100;
            if (lebarBar > 100) lebarBar = 100;
            
            barFill.style.width = `${lebarBar}%`;
            barFill.style.backgroundColor = colorHex;
        });

        let totalJarakS1R1 = pctAbsolutR1 + pctAbsolutS1;
        let mainPctProfit = totalJarakS1R1 > 0 ? (pctAbsolutR1 / totalJarakS1R1) * 100 : 50;
        let mainPctRisk = 100 - mainPctProfit;

        document.getElementById('main-bar-profit').style.width = `${mainPctProfit.toFixed(0)}%`;
        document.getElementById('main-bar-profit').innerText = `PROFIT (${mainPctProfit.toFixed(0)}%)`;
        document.getElementById('main-bar-loss').style.width = `${mainPctRisk.toFixed(0)}%`;
        document.getElementById('main-bar-loss').innerText = `RISK (${mainPctRisk.toFixed(0)}%)`;

        document.getElementById('beli-1').innerText = formatRupiah(s1 * 1.002);
        document.getElementById('beli-2').innerText = formatRupiah(s1);
        document.getElementById('beli-3').innerText = formatRupiah(s2);
        document.getElementById('jual-1').innerText = formatRupiah(r1);
        document.getElementById('jual-2').innerText = formatRupiah(r1 + ((r2 - r1) / 2));
        document.getElementById('jual-3').innerText = formatRupiah(r2);

        let prediksi = "";
        if (hb > r1) {
            prediksi = "Bullish Kuat (Kejar R2)";
        } else if (hb < s1) {
            prediksi = "Breakdown Bearish (Jebol S1, Menuju S2)";
        } else {
            const pctJarakKeR1 = ((r1 - hb) / hb) * 100;
            if (pctJarakKeR1 <= 0.30) {
                prediksi = "Sideways Mepet (⚠️ Resiko Tergerus Fee Bursa)";
            } else {
                prediksi = "Sideways / Konsolidasi (S1-R1)";
            }
        }
        
        let listJarak = [
            { nama: 'R2', nilai: Math.abs(r2 - hb), pct: ((r2 - hb) / hb) * 100, tipe: 'R' },
            { nama: 'R1', nilai: Math.abs(r1 - hb), pct: ((r1 - hb) / hb) * 100, tipe: 'R' },
            { nama: 'S1', nilai: Math.abs(s1 - hb), pct: ((s1 - hb) / hb) * 100, tipe: 'S' },
            { nama: 'S2', nilai: Math.abs(s2 - hb), pct: ((s2 - hb) / hb) * 100, tipe: 'S' }
        ];
        
        listJarak.sort((a, b) => a.nilai - b.nilai);
        
        // PERBAIKAN BUG UTAMA: Mengunci indeks array agar text murni muncul normal kembali
        let dataTerdekat = listJarak[0]; 
        let realPct = dataTerdekat.tipe === 'S' ? -Math.abs(dataTerdekat.pct) : Math.abs(dataTerdekat.pct);
        let signTerdekat = realPct > 0 ? "+" : "";
        let teksTerdekat = `${dataTerdekat.nama} (${signTerdekat}${realPct.toFixed(2)}%)`;

        document.getElementById('summary').innerHTML = `<strong>Tren:</strong> ${prediksi} | Terdekat menuju <strong>${teksTerdekat}</strong>.`;
        
        localStorage.setItem('crypto_tracker_data_v2', JSON.stringify({
            hb: document.getElementById('hb').value,
            r2: document.getElementById('r2').value,
            r1: document.getElementById('r1').value,
            s1: document.getElementById('s1').value,
            s2: document.getElementById('s2').value
        }));
    }

    function kirimWA() {
        hitungData();
        const hb = document.getElementById('hb').value;
        const r2 = document.getElementById('pct-r2').innerText;
        const r1 = document.getElementById('pct-r1').innerText;
        const s1 = document.getElementById('pct-s1').innerText;
        const s2 = document.getElementById('pct-s2').innerText;
        
        const text = `*Crypto Spot Update*\n---------------------------\n- *Harga Bergerak:* Rp ${hb}\n- *Target %:*\n  R2: ${r2}\n  R1: ${r1}\n  S1: ${s1}\n  S2: ${s2}\n---------------------------\n_Via Crypto Pivot Tracker_`;

        if (navigator.share) {
            navigator.share({
                title: 'Crypto Spot Update',
                text: text
            }).catch(console.error);
        } else {
            navigator.clipboard.writeText(text).then(function() {
                alert('Teks update berhasil disalin! Silakan tempel (paste) manual ke WhatsApp.');
            }, function() {
                alert('Gagal menyalin otomatis.');
            });
        }
    }

    function resetForm() {
        ['hb', 'r2', 'r1', 's1', 's2'].forEach(id => document.getElementById(id).value = "");
        const fields = ['dist-r2', 'pct-r2', 'dist-r1', 'pct-r1', 'dist-s1', 'pct-s1', 'dist-s2', 'pct-s2', 'beli-1', 'beli-2', 'beli-3', 'jual-1', 'jual-2', 'jual-3'];
        fields.forEach(id => document.getElementById(id).innerText = "-");
        ['r2', 'r1', 's1', 's2'].forEach(id => document.getElementById(`bar-${id}`).style.width = "0%");
        
        document.getElementById('main-bar-profit').style.width = "50%";
        document.getElementById('main-bar-profit').innerText = "PROFIT (50%)";
        document.getElementById('main-bar-loss').style.width = "50%";
        document.getElementById('main-bar-loss').innerText = "RISK (50%)";
        
        document.getElementById('summary').innerText = "Masukkan data lalu ketuk Simpan/Hitung.";
        localStorage.removeItem('crypto_tracker_data_v2');
    }

    window.onload = function() {
        const savedData = localStorage.getItem('crypto_tracker_data_v2');
        if (savedData) {
            const data = JSON.parse(savedData);
            document.getElementById('hb').value = data.hb;
            document.getElementById('r2').value = data.r2;
            document.getElementById('r1').value = data.r1;
            document.getElementById('s1').value = data.s1;
            document.getElementById('s2').value = data.s2;
        }
        hitungData();
    }
</script>
