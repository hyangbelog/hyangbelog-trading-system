<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- WAJIB ADA: Pengaturan utama untuk layar HP/Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Pivot & Risk Tracker Live</title>
  
  <style>
    /* Reset CSS dasar untuk Mobile Dark Mode */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #000000; /* Hitam pekat agar menyatu dengan navigasi blog */
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-sizing: border-box;
    }

    /* Container utama otomatis menyesuaikan lebar layar HP */
    .container {
      width: 100%;
      max-width: 100%;
      padding: 15px; /* Jarak aman agar teks tidak menempel ke pinggir layar HP */
      box-sizing: border-box;
    }

    /* Memastikan elemen input & select ramah sentuhan jari di HP */
    select, input, button {
      font-size: 16px !important; /* Mencegah browser iOS/Safari otomatis zoom-in saat diklik */
      padding: 8px 12px;
      border-radius: 6px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Sambungkan ke kode asli Anda mulai dari sini -->
  <div class="container">
    <h3>Crypto Pivot & Risk Tracker</h3>
    
    <!-- FITUR BARU: Dropdown Pilihan Koin dan Mata Uang -->
    <div class="grid-inputs" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 4px;">
