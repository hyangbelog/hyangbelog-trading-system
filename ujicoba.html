<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Harga Live Indodax</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: white; text-align: center; }
        .kotak { border: 2px solid #00e676; padding: 20px; border-radius: 8px; display: inline-block; margin-top: 20px; background: #1e1e1e; min-width: 280px; }
        .sukses { color: #00e676; font-size: 26px; font-weight: bold; }
        .error { color: #ff5252; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Pengujian Harga Live BTC/IDR Indodax</h2>
    <p>Berjalan Aman via Protokol HTTPS Web...</p>

    <div class="kotak">
        <p>Harga Terakhir Indodax:</p>
        <div id="log-status" class="sukses">Memuat data pasar...</div>
    </div>

    <script>
        async function ambilHargaLiveWeb() {
            const statusBox = document.getElementById('log-status');
            try {
                // Menggunakan proxy gratis allorigins yang sangat stabil jika dijalankan dari server web asli
                const targetUrl = "https://indodax.com";
                const response = await fetch("https://allorigins.win" + encodeURIComponent(targetUrl));
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);

                if (data && data.ticker && data.ticker.last) {
                    const hargaBtc = parseFloat(data.ticker.last);
                    statusBox.innerText = "Rp " + hargaBtc.toLocaleString('id-ID');
                } else {
                    statusBox.innerText = "Gagal memproses data Indodax.";
                }
            } catch (err) {
                statusBox.className = "error";
                statusBox.innerText = "Gagal memuat harga: " + err.message;
            }
        }

        // Jalankan langsung saat website diakses
        ambilHargaLiveWeb();
        
        // Perbarui setiap 5 detik sekali
        setInterval(ambilHargaLiveWeb, 5000);
    </script>

</body>
</html>
