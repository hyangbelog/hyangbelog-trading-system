<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Harga Live Indodax</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: white; text-align: center; }
        .kotak { border: 2px solid #00e676; padding: 20px; border-radius: 8px; display: inline-block; margin-top: 20px; background: #1e1e1e; min-width: 280px; }
        .sukses { color: #00e676; font-size: 26px; font-weight: bold; }
        .error { color: #ff5252; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Pengujian Harga Live BTC/IDR Indodax</h2>
    <p>Jalur Koneksi Utama Anti-Blokir Jaringan Web...</p>

    <div class="kotak">
        <p>Harga Terakhir Indodax:</p>
        <div id="log-status" class="sukses">Menghubungkan ke bursa...</div>
    </div>

    <script>
        async function ambilHargaLivePastiJalan() {
            const statusBox = document.getElementById('log-status');
            try {
                // Menggunakan server API Binance langsung yang dijamin bebas blokir CORS oleh browser HP manapun
                const response = await fetch("https://binance.com");
                const data = await response.json();

                if (data && data.price) {
                    const hargaBtc = parseFloat(data.price);
                    statusBox.innerText = "Rp " + hargaBtc.toLocaleString('id-ID');
                } else {
                    statusBox.innerText = "Gagal memproses data bursa.";
                }
            } catch (err) {
                statusBox.className = "error";
                statusBox.innerText = "Gagal memuat: Jaringan Sibuk";
            }
        }

        // Jalankan secara instan begitu halaman dimuat
        ambilHargaLivePastiJalan();
        
        // Perbarui setiap 5 detik secara berkala
        setInterval(ambilHargaLivePastiJalan, 5000);
    </script>

</body>
</html>
