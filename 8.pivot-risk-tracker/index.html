<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Harga & Grafik Indodax - Dark Mode</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #121824;
            --border: #1e293b;
            --text-soft: #64748b;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Wadah utama ukuran minimalis HP */
        .blog-crypto-widget {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 1. Kotak Ticker Berjalan Paling Atas (Data Indodax) */
        .ticker-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 8px 4px 8px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 2. Kotak Grafik Utama di Tengah (Data Indodax) */
        .chart-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            height: 420px;
            overflow: hidden;
            box-sizing: border-box;
        }

        #tv_chart_terminal {
            width: 100%;
            height: 100%;
        }

        /* 3. Teks Disclaimer Kecil & Soft di Bawah */
        .disclaimer-text {
            font-size: 10px;
            color: var(--text-soft);
            text-align: center;
            line-height: 1.45;
            padding: 4px 8px;
            margin: 0;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="blog-crypto-widget">
        
        <!-- BAGIAN 1: TICKER BERJALAN INDODAX PALING ATAS -->
        <div class="ticker-card">
            <script type="module" src="https://tradingview-widget.com"></script>
            <tv-ticker-tape 
                symbols="INDODAX:BTCIDR,INDODAX:ETHIDR,INDODAX:SOLIDR,INDODAX:BNBIDR,INDODAX:USDTIDR" 
                theme="dark" 
                locale="id">
            </tv-ticker-tape>
        </div>

        <!-- BAGIAN 2: GRAFIK TRADINGVIEW INDODAX DI BAWAHNYA -->
        <div class="chart-card">
            <div id="tv_chart_terminal"></div>
        </div>

        <!-- BAGIAN 3: DISCLAIMER KECIL & SOFT -->
        <p class="disclaimer-text">
            <strong>Disclaimer:</strong> Data harga dan grafik disediakan oleh TradingView bersumber dari pasar Indodax hanya untuk tujuan informasi dan edukasi, bukan merupakan saran investasi atau ajakan jual beli. Selalu lakukan riset mandiri (DYOR) sebelum mengambil keputusan finansial.
        </p>

    </div>

    <!-- Script Inisialisasi Grafik TradingView -->
    <script type="text/javascript" src="https://tradingview.com"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "INDODAX:BTCIDR",
            "interval": "240",
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "toolbar_bg": "#121824",
            "backgroundColor": "#121824",
            "gridColor": "rgba(30, 41, 59, 0.4)",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "save_image": false,
            "container_id": "tv_chart_terminal"
        });
    </script>

</body>
</html>
