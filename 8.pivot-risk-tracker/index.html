<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Terminal & Uji Harga Live</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
        }
        .main-wrap {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .box-card {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px;
            box-sizing: border-box;
        }
        .chart-box {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            height: 360px;
            overflow: hidden;
        }
        .live-title {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #3b82f6;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
        }
        .live-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }
        .live-grid select, .live-grid input {
            width: 100%;
            padding: 7px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #ffffff;
            font-size: 12px;
            box-sizing: border-box;
        }
        .btn-uji {
            background: #22c55e;
            color: #000000;
            border: none;
            width: 100%;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .status-info {
            margin-top: 6px;
            font-size: 11px;
            text-align: center;
            color: #94a3b8;
        }
        .disclaimer {
            font-size: 10px;
            color: #64748b;
            text-align: center;
            line-height: 1.4;
            margin: 0;
            padding: 2px 6px;
        }
    </style>
</head>
<body>

<div class="main-wrap">

    <!-- 1. TICKER BERJALAN (Persis Struktur Asli Anda) -->
    <div class="box-card" style="padding-bottom: 2px;">
        <script type="module" src="https://tradingview-widget.com"></script>
        <tv-ticker-tape symbols="BTCIDR,ETHIDR,BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:BNBUSDT" theme="dark" locale="id"></tv-ticker-tape>
    </div>

    <!-- 2. GRAFIK TRADINGVIEW (Persis Struktur Asli Anda) -->
    <div class="chart-box">
        <div id="tv_chart_terminal" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- 3. UJI PENARIKAN HARGA LIVE (Menggunakan XMLHttpRequest Klasik Anti-Macet) -->
    <div class="box-card">
        <div class="live-title">Uji Penarikan Harga Live</div>
        <div class="live-grid">
            <select id="pilihPair" onchange="tarikHargaLive()">
                <option value="BTC-USD">BTC / USD</option>
                <option value="BTC-IDR">BTC / IDR</option>
                <option value="ETH-USD">ETH / USD</option>
                <option value="ETH-IDR">ETH / IDR</option>
                <option value="SOL-USD">SOL / USD</option>
            </select>
            <input type="number" id="kolomHarga" placeholder="Harga Live..." step="any" />
        </div>
        <button type="button" class="btn-uji" onclick="tarikHargaLive()">Perbarui Harga Sekarang</button>
        <div id="statusPesan" class="status-info">Siap menarik harga...</div>
    </div>

    <!-- 4. DISCLAIMER -->
    <p class="disclaimer">
        <strong>Disclaimer:</strong> Data harga dan grafik disediakan oleh TradingView &amp; Coinbase hanya untuk tujuan informasi dan edukasi, bukan merupakan saran investasi atau ajakan jual beli. Selalu lakukan riset mandiri (DYOR) sebelum mengambil keputusan finansial.
    </p>

</div>

<script type="text/javascript" src="https://tradingview.com"></script>
<script type="text/javascript">
    // Inisialisasi Grafik TradingView (Persis kode asli Anda)
    new TradingView.widget({
        "autosize": true,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "240",
        "timezone": "Asia/Jakarta",
        "theme": "dark",
        "style": "1",
        "locale": "id",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_terminal"
    });

    // Penarik Harga Live dengan XMLHttpRequest (Kompatibel penuh di semua WebView & Browser HP)
    function tarikHargaLive() {
        var pair = document.getElementById('pilihPair').value;
        var inputHarga = document.getElementById('kolomHarga');
        var statusText = document.getElementById('statusPesan');

        statusText.innerText = "Mengambil data...";
        statusText.style.color = "#f59e0b";

        var xhr = new XMLHttpRequest();
        xhr.open("GET", "https://coinbase.com" + pair + "/spot", true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var hasil = JSON.parse(xhr.responseText);
                        var angka = parseFloat(hasil.data.amount);
                        var isIDR = pair.indexOf("IDR") !== -1;
                        var hargaBersih = isIDR ? Math.round(angka) : angka.toFixed(2);

                        inputHarga.value = hargaBersih;

                        var simbol = isIDR ? "Rp " : "$";
                        var waktu = new Date().toLocaleTimeString("id-ID");
                        statusText.innerText = "Berhasil! " + pair + ": " + simbol + Number(hargaBersih).toLocaleString("id-ID") + " (" + waktu + ")";
                        statusText.style.color = "#22c55e";
                    } catch (e) {
                        statusText.innerText = "Gagal membaca data harga.";
                        statusText.style.color = "#ef4444";
                    }
                } else {
                    statusText.innerText = "Koneksi terhambat (Kode: " + xhr.status + ")";
                    statusText.style.color = "#ef4444";
                }
            }
        };
        xhr.send();
    }

    // Jalankan otomatis setelah halaman selesai dimuat
    window.onload = function() {
        tarikHargaLive();
    };
</script>

</body>
</html>
