<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView Ticker</title>
  <style>
    body {
      margin: 0;
      padding: 4px;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .ticker-box {
      background-color: #121824;
      border: 1px solid #1e293b;
      border-radius: 6px;
      overflow: hidden;
      width: 100%;
      box-sizing: border-box;
    }
    .disclaimer-box {
      background-color: #121824;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 5px 8px;
      margin-top: 4px;
      text-align: center;
      font-size: 7px;
      line-height: 1.3;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- 1. TICKER TAPE TRADINGVIEW -->
  <div class="ticker-box">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://tradingview.com" async>
      {
        "symbols": [
          { "proName": "INDODAX:BTCIDR", "title": "BTC/IDR" },
          { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
          { "proName": "BINANCE:ETHUSDT", "title": "ETH/USDT" },
          { "proName": "BINANCE:SOLUSDT", "title": "SOL/USDT" }
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "id"
      }
      </script>
    </div>
  </div>

  <!-- 2. DISCLAIMER KECIL -->
  <div class="disclaimer-box">
    <strong>Disclaimer:</strong> Data harga disediakan oleh TradingView hanya untuk tujuan informasi dan edukasi, bukan saran investasi atau ajakan jual beli. Selalu lakukan riset mandiri (DYOR) sebelum mengambil keputusan finansial.
  </div>

</body>
</html>
