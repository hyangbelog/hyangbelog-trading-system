<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker Live Spot IDR & USDT - Polos</title>
    <style>
        body {
            margin: 0;
            padding: 12px;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .ticker-mobile-box {
            background: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 8px;
            width: 100%;
            max-width: 390px;
            box-sizing: border-box;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        /* Wadah pemotong agar tulisan "Ticker tape by TradingView" di bawah tersembunyi */
        .tv-ticker-crop {
            width: 100%;
            height: 76px; /* Tinggi pas untuk kartu ticker tanpa teks bawah */
            overflow: hidden;
            border-radius: 6px;
            position: relative;
        }

        tv-ticker-tape {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="ticker-mobile-box">
        <div class="tv-ticker-crop">
            <script type="module" src="https://tradingview-widget.com"></script>
            <tv-ticker-tape 
                symbols="BTCIDR,ETHIDR,BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:BNBUSDT" 
                theme="dark" 
                locale="id">
            </tv-ticker-tape>
        </div>
    </div>

</body>
</html>
