<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker & Grafik TradingView</title>
    <style>
        body {
            background-color: #0b0f19;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .dashboard {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ticker-box {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 6px 6px 2px 6px;
            overflow: hidden;
        }
        .chart-box {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            height: 450px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="ticker-box">
            <script type="module" src="https://tradingview-widget.com"></script>
            <tv-ticker-tape symbols="BTCIDR,ETHIDR,BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:BNBUSDT" theme="dark" locale="id"></tv-ticker-tape>
        </div>

        <div class="chart-box">
            <div id="tv_chart_terminal" style="width: 100%; height: 100%;"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://tradingview.com"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "BINANCE:BTCUSDT",
            "interval": "240",
            "timezone": "Asia/Jakarta",
            "theme": "dark",
            "style": "1",
            "locale": "id",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tv_chart_terminal"
        });
    </script>

</body>
</html>
