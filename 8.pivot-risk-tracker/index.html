<!-- KODE GABUNGAN TICKER LIVE TRADINGVIEW + KALKULATOR DCA MANDIRI (ANTI-GAGAL) -->
<div class="dca-mini-box">
  <h3>Simulasi & Harga Live Spot</h3>
  
  <!-- WIDGET TICKER RESMI TRADINGVIEW (Aman, Legal, Akurat & Pasti Muncul di HP) -->
  <div class="tv-ticker-container" style="margin-bottom: 12px;">
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"></script>
    <tv-ticker-tape symbols="BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:BNBUSDT" theme="light" locale="id"></tv-ticker-tape>
  </div>

  <!-- Grid Form 2 Kolom untuk Menghemat Ruang Vertikal HP -->
  <div class="dca-mini-grid">
    <div class="dca-mini-field">
      <label>Nama Aset Kripto:</label>
      <input type="text" id="coinName" value="Bitcoin (BTC)" />
    </div>

    <div class="dca-mini-field">
      <label>Harga Input (Lihat Ticker di Atas):</label>
      <input type="number" id="manualPrice" value="65000" min="1" />
    </div>

    <div class="dca-mini-field">
      <label>Dana Per Interval (USD):</label>
      <input type="number" id="investmentAmount" value="50" min="1" />
    </div>

    <div class="dca-mini-field">
      <label>Durasi (Bulan):</label>
      <input type="number" id="duration" value="12" min="1" />
    </div>
    
    <div class="dca-mini-field">
      <label>Frekuensi:</label>
      <select id="frequency">
        <option value="7" />Mingguan
        <option value="30" selected />Bulanan
      </select>
    </div>

    <div class="dca-mini-field">
      <label>Tren Pasar Pasca-DCA:</label>
      <select id="marketTrend">
        <option value="0.2" />Bullish (+20%)
        <option value="0" selected />Sideways (Flat)
        <option value="-0.2" />Bearish (-20%)
      </select>
    </div>
  </div>

  <button type="button" class="dca-mini-btn" onclick="hitungDCA()">Hitung Sekarang</button>

  <!-- Hasil Box Kompak Rapat -->
  <div id="dcaResult" class="dca-mini-result" style="display: none;">
    <div class="dca-res-row"><span>Total Investasi:</span> <strong id="resTotalInvested"></strong></div>
    <div class="dca-res-row"><span>Koin Didapat:</span> <strong id="resTotalCoins"></strong></div>
    <div class="dca-res-row"><span>Harga Rata2 Beli:</span> <strong id="resAvgPrice"></strong></div>
    <div class="dca-res-row"><span>Nilai Akhir Portofolio:</span> <strong id="resFinalValue"></strong></div>
    <div class="dca-res-row" style="border-bottom:none; margin-bottom:0; padding-bottom:0;">
      <span>Persentase ROI:</span> <strong id="resReturnPct"></strong>
    </div>
  </div>
</div>

<!-- Desain CSS Padat Rapat Full Layar HP -->

  background: #ffffff;
  border: 1px solid #e2e8f0;

  padding: 10px;

  box-sizing: border-box;

  color: #2d3748;

  font-size: 15px;
  text-align: center;
  color: #1a202c;
  font-weight: 700;
}
.dca-mini-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.dca-mini-field {
  display: flex;
  flex-direction: column;
}

  font-size: 11px;

  margin-bottom: 2px;

}
.dca-mini-field input, .dca-mini-field select {
  width: 100%;
  padding: 5px 8px;
  border: 1px solid #cbd5e0;
  border-radius: 4px;
  font-size: 12px;
  box-sizing: border-box;

  background: #0084ff;

  border: none;

  border-radius: 4px;

  display: flex;
  justify-content: space-between;

  margin-bottom: 4px;
  border-bottom: 1px dashed #cbd5e0;
  padding-bottom: 4px;
}
</style>

<!-- Logika Matematika Kalkulator -->
<script>
function hitungDCA() {
  const currentPrice = parseFloat(document.getElementById('manualPrice').value);
  const amount = parseFloat(document.getElementById('investmentAmount').value);
  const freq = parseInt(document.getElementById('frequency').value);
  const durationMonths = parseInt(document.getElementById('duration').value);
  const trend = parseFloat(document.getElementById('marketTrend').value);

  if (isNaN(currentPrice) || currentPrice <= 0 || isNaN(amount) || amount <= 0 || isNaN(durationMonths) || durationMonths <= 0) {
    alert("Mohon isi semua data angka dengan benar.");
    return;
  }

  let totalPurchases = durationMonths;
  if (freq === 7) {
    totalPurchases = Math.floor((durationMonths * 30) / 7);
  }

  const totalInvested = amount * totalPurchases;
  let totalCoinsAccumulated = 0;

  const targetPrice = currentPrice * (1 + trend);
  const priceStep = (targetPrice - currentPrice) / (totalPurchases || 1);

  for (let i = 0; i < totalPurchases; i++) {
    let simulatedPriceAtStep = currentPrice + (priceStep * i);
    if (simulatedPriceAtStep <= 0) simulatedPriceAtStep = currentPrice * 0.1;
    totalCoinsAccumulated += (amount / simulatedPriceAtStep);
  }

  const averageBuyingPrice = totalInvested / totalCoinsAccumulated;
  const finalPortfolioValue = totalCoinsAccumulated * currentPrice;
  const returnPercentage = ((finalPortfolioValue - totalInvested) / totalInvested) * 100;

  document.getElementById('resTotalInvested').innerText = `$${totalInvested.toLocaleString('en-US', {maximumFractionDigits: 2})}`;
  document.getElementById('resTotalCoins').innerText = totalCoinsAccumulated.toFixed(5);
  document.getElementById('resAvgPrice').innerText = `$${averageBuyingPrice.toLocaleString('en-US', {maximumFractionDigits: 2})}`;
  document.getElementById('resFinalValue').innerText = `$${finalPortfolioValue.toLocaleString('en-US', {maximumFractionDigits: 2})}`;

  const returnEl = document.getElementById('resReturnPct');
  returnEl.innerText = `${returnPercentage >= 0 ? '+' : ''}${returnPercentage.toFixed(2)}%`;
  returnEl.style.color = returnPercentage >= 0 ? '#22543d' : '#9b2c2c';

  document.getElementById('dcaResult').style.display = 'block';
}
</script>
