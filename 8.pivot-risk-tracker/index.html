<div class="crypto-terminal-wrap">
  <!-- 1. TICKER BERJALAN DARK MODE -->
  <div class="ct-card">
    <script type="module" src="https://tradingview-widget.com"></script>
    <tv-ticker-tape symbols="BTCIDR,ETHIDR,BINANCE:BTCUSDT,BINANCE:ETHUSDT,BINANCE:BNBUSDT" theme="dark" locale="id"></tv-ticker-tape>
  </div>

  <!-- 2. GRAFIK TRADINGVIEW -->
  <div class="ct-chart-card">
    <div id="tv_chart_terminal" style="width: 100%; height: 100%;"></div>
  </div>

  <!-- 3. UJI PENARIKAN HARGA LIVE -->
  <div class="ct-card">
    <div class="ct-title">Uji Penarikan Harga Live</div>
    <div class="ct-grid">
      <select id="pilihPair" onchange="tarikHargaLive()">
        <option value="BTC-USD">BTC / USD</option>
        <option value="BTC-IDR">BTC / IDR</option>
        <option value="ETH-USD">ETH / USD</option>
        <option value="ETH-IDR">ETH / IDR</option>
        <option value="SOL-USD">SOL / USD</option>
      </select>
      <input type="number" id="kolomHarga" placeholder="Harga Live..." step="any" />
    </div>
    <button type="button" class="ct-btn" onclick="tarikHargaLive()">Perbarui Harga Sekarang</button>
    <div id="statusPesan" class="ct-status">Siap menarik harga...</div>
  </div>

  <!-- 4. DISCLAIMER SOFT -->
  <p class="ct-disclaimer">
    <strong>Disclaimer:</strong> Data harga dan grafik disediakan oleh TradingView &amp; Coinbase hanya untuk tujuan informasi dan edukasi, bukan merupakan saran investasi atau ajakan jual beli. Selalu lakukan riset mandiri (DYOR) sebelum mengambil keputusan finansial.
  </p>
</div>

<style>
.crypto-terminal-wrap {
  background: #0b0f19;
  color: #e2e8f0;
  padding: 8px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ct-card {
  background: #121824;
  border: 1px solid #1e293b;
  border-radius: 8px;
  padding: 8px;
  box-sizing: border-box;
  overflow: hidden;
}
.ct-chart-card {
  background: #121824;
  border: 1px solid #1e293b;
  border-radius: 8px;
  height: 360px;
  overflow: hidden;
  box-sizing: border-box;
}
.ct-title {
  margin: 0 0 8px 0;
  font-size: 12px;
  color: #3b82f6;
  text-align: center;
  font-weight: 700;
  text-transform: uppercase;
}
.ct-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 8px;
}
.ct-grid select, .ct-grid input {
  width: 100%;
  padding: 7px;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 4px;
  color: #ffffff;
  font-size: 12px;
  box-sizing: border-box;
  height: 34px;
}
.ct-btn {
  background: #22c55e;
  color: #000000;
  border: none;
  width: 100%;
  padding: 8px;
  font-size: 12px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
}
.ct-status {
  margin-top: 6px;
  font-size: 11px;
  text-align: center;
  color: #94a3b8;
}
.ct-disclaimer {
  font-size: 10px;
  color: #64748b;
  text-align: center;
  line-height: 1.4;
  margin: 0;
  padding: 2px 6px;
}
</style>

<script type="text/javascript" src="https://tradingview.com"></script>
<script>
new TradingView.widget({
  "autosize": true,
  "symbol": "BINANCE:BTCUSDT",
  "interval": "240",
  "timezone": "Asia/Jakarta",
  "theme": "dark",
  "style": "1",
  "locale": "id",
  "enable_publishing": false,
  "hide_side_toolbar": false,
  "allow_symbol_change": true,
  "container_id": "tv_chart_terminal"
});

function tarikHargaLive() {
  var pair = document.getElementById('pilihPair').value;
  var inputHarga = document.getElementById('kolomHarga');
  var statusText = document.getElementById('statusPesan');

  statusText.innerText = "Mengambil data...";
  statusText.style.color = "#f59e0b";

  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://coinbase.com" + pair + "/spot", true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var hasil = JSON.parse(xhr.responseText);
          var angka = parseFloat(hasil.data.amount);
          var isIDR = pair.indexOf("IDR") !== -1;
          var hargaBersih = isIDR ? Math.round(angka) : angka.toFixed(2);

          inputHarga.value = hargaBersih;

          var simbol = isIDR ? "Rp " : "$";
          var waktu = new Date().toLocaleTimeString("id-ID");
          statusText.innerText = "Berhasil! " + pair + ": " + simbol + Number(hargaBersih).toLocaleString("id-ID") + " (" + waktu + ")";
          statusText.style.color = "#22c55e";
        } catch (e) {
          statusText.innerText = "Gagal membaca data harga.";
          statusText.style.color = "#ef4444";
        }
      } else {
        statusText.innerText = "Koneksi terhambat (Kode: " + xhr.status + ")";
        statusText.style.color = "#ef4444";
      }
    }
  };
  xhr.send();
}

setTimeout(tarikHargaLive, 500);
</script>
