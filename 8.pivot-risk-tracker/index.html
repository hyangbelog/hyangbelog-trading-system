<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker & Grafik TradingView</title>
    <style>
        body {
            background-color: #0b0f19;
            margin: 0;
            padding: 8px;
            display: flex;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .dashboard {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ticker-box {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            height: 76px;
            overflow: hidden;
        }
        .chart-box {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 8px;
            height: 450px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- 1. TICKER BERJALAN TRADINGVIEW -->
        <div class="ticker-box">
            <iframe 
                scrolling="no" 
                allowtransparency="true" 
                frameborder="0" 
                src="https://tradingview-widget.com">
            </iframe>
        </div>

        <!-- 2. GRAFIK CANDLESTICK TRADINGVIEW -->
        <div class="chart-box">
            <iframe 
                scrolling="no" 
                allowtransparency="true" 
                frameborder="0" 
                src="https://tradingview-widget.com">
            </iframe>
        </div>
    </div>

</body>
</html>
