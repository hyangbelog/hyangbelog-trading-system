<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Price Action Rapat Presisi</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 10px; background: #0b111e; color: #a0aec0; font-size: 0.75rem; }
        .wrapper { max-width: 380px; margin: 0 auto; background: #111827; padding: 10px; border-radius: 6px; border: 1px solid #1f2937; }
        
        /* Judul Section */
        .section-title { background: #0070f3; color: #ffffff; padding: 5px; border-radius: 4px; font-weight: bold; text-align: center; margin: 2px 0 6px 0; font-size: 0.85rem; letter-spacing: 0.5px; }
        .sub-title { font-weight: bold; color: #718096; margin: 4px 0 2px 0; font-size: 0.72rem; display: block; }
        
        /* Form & Tombol */
        select, button { width: 100%; padding: 6px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #1f2937; background: #1f2937; color: #fff; font-size: 0.78rem; box-sizing: border-box; }
        button { background: #0070f3; color: #fff; font-weight: bold; border: none; cursor: pointer; }
        button:active { background: #0056b3; }
        
        /* Box Monitor Running */
        .box-harga { background: #0b111e; padding: 6px; border-radius: 4px; text-align: center; border: 1px solid #0070f3; margin-bottom: 6px; }
        .box-harga p { margin: 0 0 1px 0; color: #718096; font-size: 0.7rem; }
        .box-harga h3 { margin: 0; color: #ffffff; font-size: 1.1rem; }
        .live-dot { display: inline-block; width: 5px; height: 5px; background: #3b82f6; border-radius: 50%; margin-left: 3px; box-shadow: 0 0 5px #0070f3; }
        
        /* Grid Layout Super Rapat & Tipis */
        .row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .box-out { background: #1f2937; padding: 5px 8px; border-radius: 4px; border: 1px solid #1f2937; text-align: left; }
        .box-out label { font-size: 0.68rem; color: #718096; display: block; margin-bottom: 1px; }
        .box-out span { display: block; font-size: 0.8rem; font-weight: bold; }
        
        /* Warna Kontras Data */
        .color-tp { color: #3b82f6; }
        .color-sl { color: #ef4444; }
        .color-val { color: #e2e8f0; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Bagian 1: Price Action -->
    <div class="section-title">PRICE ACTION LIVE</div>
    
    <select id="pilihanKoin">
        <option value="btc">Bitcoin (BTC / IDR)</option>
        <option value="eth">Ethereum (ETH / IDR)</option>
        <option value="sol">Solana (SOL / IDR)</option>
        <option value="ada">Cardano (ADA / IDR)</option>
        <option value="xrpl">XRP (XRP / IDR)</option>
    </select>

    <button onclick="prosesDataLive()">Ambil Harga & Hitung</button>

    <div class="box-harga">
        <p>Harga Bergerak (HB) <span class="live-dot"></span></p>
        <h3 id="hargaLive">Rp 0</h3>
    </div>

    <span class="sub-title">Rencana Trading:</span>
    <div class="row-grid">
        <div class="box-out">
            <label>Take Profit (5%):</label>
            <span id="targetTP" class="color-tp">Rp 0</span>
        </div>
        <div class="box-out">
            <label>Stop Loss (2%):</label>
            <span id="targetSL" class="color-sl">Rp 0</span>
        </div>
    </div>

    <!-- Bagian 2: Pivot Tracker -->
    <div class="section-title" style="margin-top: 10px;">PIVOT & RISK TRACKER</div>
    
    <span class="sub-title">Level Resisten (Batas Atas):</span>
    <div class="row-grid">
        <div class="box-out">
            <label>Resisten 2 (R2)</label>
            <span id="outputR2" class="color-val">Rp 0</span>
        </div>
        <div class="box-out">
            <label>Resisten 1 (R1)</label>
            <span id="outputR1" class="color-val">Rp 0</span>
        </div>
    </div>

    <span class="sub-title">Level Support (Batas Bawah):</span>
    <div class="row-grid">
        <div class="box-out">
            <label>Support 1 (S1)</label>
            <span id="outputS1" class="color-val">Rp 0</span>
        </div>
        <div class="box-out">
            <label>Support 2 (S2)</label>
            <span id="outputS2" class="color-val">Rp 0</span>
        </div>
    </div>
</div>

<script>
async function prosesDataLive() {
    const koin = document.getElementById('pilihanKoin').value;
    
    try {
        const respon = await fetch(`https://indodax.com/api/ticker/${koin}_idr`);
        if (!respon.ok) {
            throw new Error(`HTTP ${respon.status}`);
        }

        const data = await respon.json();
        const ticker = data.ticker || data;
        const hargaTerakhir = parseFloat(ticker.last);
        const hargaTertinggi = parseFloat(ticker.high);
        const hargaTerendah = parseFloat(ticker.low);

        if (!Number.isFinite(hargaTerakhir) || !Number.isFinite(hargaTertinggi) || !Number.isFinite(hargaTerendah)) {
            throw new Error('Data harga tidak valid');
        }
        
        // Tampilkan Harga Live
        document.getElementById('hargaLive').innerText = `Rp ${hargaTerakhir.toLocaleString('id-ID')}`;
        
        // Perhitungan TP & SL
        const tp = hargaTerakhir * 1.05;
        const sl = hargaTerakhir * 0.98;
        document.getElementById('targetTP').innerText = `Rp ${Math.round(tp).toLocaleString('id-ID')}`;
        document.getElementById('targetSL').innerText = `Rp ${Math.round(sl).toLocaleString('id-ID')}`;
        
        // Perhitungan Pivot Point Standard
        const pivotPoint = (hargaTertinggi + hargaTerendah + hargaTerakhir) / 3;
        const r1 = (2 * pivotPoint) - hargaTerendah;
        const r2 = pivotPoint + (hargaTertinggi - hargaTerendah);
        const s1 = (2 * pivotPoint) - hargaTertinggi;
        const s2 = pivotPoint - (hargaTertinggi - hargaTerendah);
        
        // Tampilkan Hasil Pivot dengan Pembulatan Rapi
        document.getElementById('outputR2').innerText = `Rp ${Math.round(r2).toLocaleString('id-ID')}`;
        document.getElementById('outputR1').innerText = `Rp ${Math.round(r1).toLocaleString('id-ID')}`;
        document.getElementById('outputS1').innerText = `Rp ${Math.round(s1).toLocaleString('id-ID')}`;
        document.getElementById('outputS2').innerText = `Rp ${Math.round(s2).toLocaleString('id-ID')}`;
        
    } catch (error) {
        alert("Gagal memuat data live INDODAX.");
        console.error(error);
    }
}
</script>

</body>
</html>
