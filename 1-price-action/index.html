<div class="blibe-pa-container">
    <div class="blibe-pa-header">
        <h3>📊 Price Action Pro (Spot)</h3>
    </div>
    
    <div class="blibe-pa-body">
        <!-- ZONA 1 -->
        <div class="blibe-pa-section-title">1. KEY LEVEL (S/R)</div>
        <div class="blibe-pa-row-split">
            <div class="blibe-pa-group">
                <label>RESISTANCE</label>
                <div class="blibe-pa-input-wrap">
                    <span class="blibe-pa-addon">Rp</span>
                    <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-pa-spot-r" value="1.362.000.000" oninput="formatDanHitung(this, 'all')" />
                </div>
            </div>
            <div class="blibe-pa-group">
                <label>SUPPORT</label>
                <div class="blibe-pa-input-wrap">
                    <span class="blibe-pa-addon">Rp</span>
                    <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-pa-spot-s" value="1.330.000.000" oninput="formatDanHitung(this, 'all')" />
                </div>
            </div>
        </div>

        <!-- ZONA 2 -->
        <div class="blibe-pa-section-title" style="margin-top:3px;">2. DATA CANDLESTICK</div>
        <div class="blibe-pa-candle-stack">
            <div class="blibe-pa-cbox">
                <div class="blibe-pa-row-split">
                    <div class="blibe-pa-group">
                        <label>C1 OPEN</label>
                        <div class="blibe-pa-input-wrap">
                            <span class="blibe-pa-addon">Rp</span>
                            <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-c1-open" value="1.351.997.000" oninput="formatDanHitung(this, 'all')" />
                        </div>
                    </div>
                    <div class="blibe-pa-group">
                        <label>C1 CLOSE</label>
                        <div class="blibe-pa-input-wrap">
                            <span class="blibe-pa-addon">Rp</span>
                            <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-c1-close" value="1.359.576.000" oninput="formatDanHitung(this, 'all')" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="blibe-pa-cbox">
                <div class="blibe-pa-row-split" style="margin-bottom:2px;">
                    <div class="blibe-pa-group">
                        <label>C2 OPEN</label>
                        <div class="blibe-pa-input-wrap">
                            <span class="blibe-pa-addon">Rp</span>
                            <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-c2-open" value="1.359.576.000" oninput="formatDanHitung(this, 'all')" />
                        </div>
                    </div>
                    <div class="blibe-pa-group">
                        <label>C2 HIGH</label>
                        <div class="blibe-pa-input-wrap">
                            <span class="blibe-pa-addon">Rp</span>
                            <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-c2-high" value="1.362.000.000" oninput="formatDanHitung(this, 'all')" />
                        </div>
                    </div>
                </div>
                <div class="blibe-pa-row-split">
                    <div class="blibe-pa-group">
                        <label>C2 LOW</label>
                        <div class="blibe-pa-input-wrap">
                            <span class="blibe-pa-addon">Rp</span>
                            <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-c2-low" value="1.318.001.000" oninput="formatDanHitung(this, 'all')" />
                        </div>
                    </div>
                    <div class="blibe-pa-group">
                        <label>C2 CLOSE</label>
                        <div class="blibe-pa-input-wrap">
                            <span class="blibe-pa-addon">Rp</span>
                            <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-c2-close" value="1.332.050.000" oninput="formatDanHitung(this, 'all')" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL SINYAL -->
        <div class="blibe-pa-analysis-box">
            <div class="blibe-pa-score-row">
                <span>Sinyal: <strong id="blibe-pa-pola" class="blibe-text-warn">-</strong></span>
                <span>Skor: <strong id="blibe-pa-skor" class="blibe-text-warn">0%</strong></span>
            </div>
            <div id="blibe-pa-narasi" class="blibe-pa-narasi-txt">-</div>
        </div>

        <!-- ZONA 3 -->
        <div class="blibe-pa-section-title" style="margin-top:3px;">3. MANAJEMEN RISIKO</div>
        <div class="blibe-pa-row-split" style="margin-bottom:2px;">
            <div class="blibe-pa-group">
                <label>SALDO (EQUITY)</label>
                <div class="blibe-pa-input-wrap">
                    <span class="blibe-pa-addon">Rp</span>
                    <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-pa-balance" value="10.000.000" oninput="formatDanHitung(this, 'risk')" />
                </div>
            </div>
            <div class="blibe-pa-group">
                <label>RESIKO (%)</label>
                <div class="blibe-pa-input-wrap">
                    <input type="number" id="blibe-pa-risk-pct" value="1" step="0.1" oninput="hitungManajemenRisiko()" />
                    <span class="blibe-pa-addon">%</span>
                </div>
            </div>
        </div>

        <div class="blibe-pa-row-split" style="margin-bottom:2px;">
            <div class="blibe-pa-group">
                <label>ENTRY (BELI)</label>
                <div class="blibe-pa-input-wrap">
                    <span class="blibe-pa-addon">Rp</span>
                    <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-pa-entry" value="1.332.050.000" oninput="formatDanHitung(this, 'entry')" />
                </div>
            </div>
            <div class="blibe-pa-group">
                <label>TARGET TP (%)</label>
                <div class="blibe-pa-input-wrap">
                    <input type="number" id="blibe-pa-tp-pct" value="2.25" step="0.05" oninput="overridePersen('tp')" />
                    <span class="blibe-pa-addon">%</span>
                </div>
            </div>
        </div>

        <div class="blibe-pa-row-split" style="margin-bottom:2px;">
            <div class="blibe-pa-group">
                <label>HARGA TP</label>
                <div class="blibe-pa-input-wrap">
                    <span class="blibe-pa-addon">Rp</span>
                    <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-pa-tp-price" value="1.362.000.000" oninput="formatDanHitung(this, 'tp_price')" />
                </div>
            </div>
            <div class="blibe-pa-group">
                <label>JARAK SL (%)</label>
                <div class="blibe-pa-input-wrap">
                    <input type="number" id="blibe-pa-sl-pct" value="1.25" step="0.05" oninput="overridePersen('sl')" />
                    <span class="blibe-pa-addon">%</span>
                </div>
            </div>
        </div>

        <div class="blibe-pa-group" style="margin-bottom:4px;">
            <label>STOP LOSS AMAN (&lt; ENTRY)</label>
            <div class="blibe-pa-input-wrap">
                <span class="blibe-pa-addon">Rp</span>
                <input type="text" inputmode="numeric" class="blibe-rupiah" id="blibe-pa-sl-price" value="1.315.365.000" oninput="formatDanHitung(this, 'sl_price')" />
            </div>
        </div>

        <!-- TOMBOL -->
        <div class="blibe-pa-actions">
            <button type="button" class="blibe-pa-btn btn-blibe-reset" onclick="resetPriceActionPro()">Reset</button>
            <button type="button" class="blibe-pa-btn btn-blibe-calc" onclick="prosesPriceActionAll()">Hitung</button>
        </div>

        <!-- HASIL -->
        <div class="blibe-pa-results">
            <div class="blibe-pa-res-item">
                <span>Rasio R:R:</span>
                <strong id="blibe-res-rr" class="blibe-text-warn">1 : 0.0</strong>
            </div>
            <div class="blibe-pa-res-item">
                <span>Uang Siap Rugi:</span>
                <strong id="blibe-res-risk-cash" class="blibe-text-danger">Rp 0</strong>
            </div>
            <div class="blibe-pa-res-total">
                <span>Belanja Maksimal:</span>
                <strong id="blibe-res-pos-size" class="blibe-text-success">Rp 0</strong>
            </div>
        </div>
    </div>
</div>

<script>
function ambilAngka(id) {
    const el = document.getElementById(id);
    if (!el) return 0;
    const bersih = String(el.value).replace(/\./g, '').replace(/[^0-9]/g, '');
    return parseFloat(bersih) || 0;
}

function setAngkaFormat(id, nilai) {
    const el = document.getElementById(id);
    if (!el) return;
    const bulat = Math.round(nilai);
    el.value = bulat > 0 ? bulat.toLocaleString('id-ID') : '0';
}

function formatDanHitung(el, aksi) {
    let raw = el.value.replace(/\D/g, '');
    el.value = raw === '' ? '' : parseInt(raw, 10).toLocaleString('id-ID');

    if (aksi === 'all') {
        prosesPriceActionAll();
    } else if (aksi === 'risk') {
        hitungManajemenRisikoInternal();
    } else if (aksi === 'entry') {
        overridePersen('tp');
        overridePersen('sl');
    } else if (aksi === 'tp_price') {
        overrideHarga('tp');
    } else if (aksi === 'sl_price') {
        overrideHarga('sl');
    }
}

function prosesPriceActionAll() {
    const spotR = ambilAngka('blibe-pa-spot-r');
    const spotS = ambilAngka('blibe-pa-spot-s');
    const c1O = ambilAngka('blibe-c1-open');
    const c1C = ambilAngka('blibe-c1-close');
    const c2O = ambilAngka('blibe-c2-open');
    const c2H = ambilAngka('blibe-c2-high');
    const c2L = ambilAngka('blibe-c2-low');
    const c2C = ambilAngka('blibe-c2-close');

    const polaEl = document.getElementById('blibe-pa-pola');
    const skorEl = document.getElementById('blibe-pa-skor');
    const narasiEl = document.getElementById('blibe-pa-narasi');

    let namaPola = "NORMAL";
    let skorValiditas = 50;
    let narasiTeks = "Harga bergerak normal di dalam rentang pasar.";
    let statusPola = "normal";

    if (c1O > 0 && c2C > 0 && c2H >= c2L) {
        const c1IsBullish = c1C >= c1O;
        const c2IsBullish = c2C >= c2O;
        const c1MaxBody = Math.max(c1O, c1C);
        const c1MinBody = Math.min(c1O, c1C);
        const c2Body = Math.abs(c2C - c2O);

        if (!c1IsBullish && c2IsBullish && c2C > c1MaxBody && c2O < c1MinBody) {
            namaPola = "BULLISH ENGULFING"; statusPola = "bullish";
            narasiTeks = "Sinyal naik kuat! Candle hijau membungkus penuh candle merah.";
        } else if (c1IsBullish && !c2IsBullish && c2C < c1MinBody && c2O > c1MaxBody) {
            namaPola = "BEARISH ENGULFING"; statusPola = "bearish";
            narasiTeks = "Sinyal turun tajam! Candle merah membungkus penuh candle hijau.";
        } else if (c2H <= Math.max(c1O, c1C) && c2L >= Math.min(c1O, c1C)) {
            namaPola = "INSIDE BAR"; statusPola = "normal";
            narasiTeks = "Pasar konsolidasi. Bersiap masuk jika menembus batas candle 1.";
        } else if (!c1IsBullish && c2IsBullish && Math.abs(c2L - c1C) / c2L < 0.005) {
            namaPola = "TWEEZER BOTTOM"; statusPola = "bullish";
            narasiTeks = "Lantai kokoh! Dua candle menolak turun di titik terendah yang sama.";
        } else {
            let upShadow2 = c2H - Math.max(c2O, c2C);
            let loShadow2 = Math.min(c2O, c2C) - c2L;

            if (loShadow2 >= (c2Body * 1.2) && loShadow2 > upShadow2) {
                namaPola = c2IsBullish ? "BULLISH HAMMER" : "REJECTION BAWAH";
                statusPola = "bullish";
                narasiTeks = "Ekor bawah panjang! Pembeli menahan harga di area bawah.";
            } else if (upShadow2 >= (c2Body * 1.5) && loShadow2 <= (c2Body * 0.5)) {
                namaPola = "SHOOTING STAR"; statusPola = "bearish";
                narasiTeks = "Penolakan ekor atas tajam, tekanan jual menahan kenaikan.";
            } else {
                namaPola = c2IsBullish ? "CANDLE BULLISH" : "CANDLE BEARISH";
                statusPola = c2IsBullish ? "bullish" : "bearish";
            }
        }

        if (spotS > 0 && spotR > 0 && spotR > spotS) {
            const jarakKeSupport = Math.abs(c2C - spotS) / c2C;
            const jarakKeResistance = Math.abs(spotR - c2C) / c2C;
            const dekatSupport = jarakKeSupport < jarakKeResistance && jarakKeSupport <= 0.015;
            const dekatResistance = jarakKeResistance < jarakKeSupport && jarakKeResistance <= 0.015;

            if (dekatSupport && statusPola === "bullish") {
                skorValiditas = 95;
                narasiTeks += " [SETUP KUAT: Pantulan terkonfirmasi di Support!]";
            } else if (dekatSupport && statusPola === "bearish") {
                skorValiditas = 70;
                narasiTeks += " [AREA SUPPORT: Menguji lantai Support. Pantau pantulan!]";
            } else if (dekatResistance && statusPola === "bearish") {
                skorValiditas = 30;
                narasiTeks += " [REJECTION ATAP: Penolakan di Resistance. Hindari beli!]";
            } else if (dekatResistance && statusPola === "bullish") {
                skorValiditas = 40;
                narasiTeks += " [RISIKO TINGGI: Dekat Resistance. Rawan Fakeout!]";
            } else {
                skorValiditas = 60;
                narasiTeks += " [ZONA TENGAH: Harga di tengah range S/R.]";
            }
        }

        polaEl.innerText = namaPola;
        skorEl.innerText = skorValiditas + "%";
        skorEl.className = skorValiditas >= 75 ? "blibe-text-success" : (skorValiditas >= 50 ? "blibe-text-warn" : "blibe-text-danger");
        polaEl.className = (statusPola === "bullish") ? "blibe-text-success" : ((statusPola === "bearish") ? "blibe-text-danger" : "blibe-text-warn");
        narasiEl.innerText = narasiTeks;

        const entry = Math.round(c2C);
        const autoSL = (c2L > 0 && c2L < entry) ? Math.round(c2L * 0.998) : Math.round(entry * 0.985);
        const autoTP = (spotR > entry) ? Math.round(spotR) : Math.round(entry * 1.025);

        setAngkaFormat('blibe-pa-entry', entry);
        setAngkaFormat('blibe-pa-sl-price', autoSL);
        setAngkaFormat('blibe-pa-tp-price', autoTP);

        document.getElementById('blibe-pa-tp-pct').value = (((autoTP - entry) / entry) * 100).toFixed(2);
        document.getElementById('blibe-pa-sl-pct').value = (((entry - autoSL) / entry) * 100).toFixed(2);
    }
    hitungManajemenRisikoInternal();
}


function overridePersen(tipe) {
    const entry = ambilAngka('blibe-pa-entry');
    if (entry <= 0) return;
    if (tipe === 'tp') {
        const tpPct = parseFloat(document.getElementById('blibe-pa-tp-pct').value) || 0;
        setAngkaFormat('blibe-pa-tp-price', entry * (1 + (tpPct / 100)));
    } else if (tipe === 'sl') {
        const slPct = parseFloat(document.getElementById('blibe-pa-sl-pct').value) || 0;
        setAngkaFormat('blibe-pa-sl-price', entry * (1 - (slPct / 100)));
    }
    hitungManajemenRisikoInternal();
}

function overrideHarga(tipe) {
    const entry = ambilAngka('blibe-pa-entry');
    if (entry <= 0) return;
    if (tipe === 'tp') {
        const tpPrice = ambilAngka('blibe-pa-tp-price');
        document.getElementById('blibe-pa-tp-pct').value = (((tpPrice - entry) / entry) * 100).toFixed(2);
    } else if (tipe === 'sl') {
        const slPrice = ambilAngka('blibe-pa-sl-price');
        document.getElementById('blibe-pa-sl-pct').value = (((entry - slPrice) / entry) * 100).toFixed(2);
    }
    hitungManajemenRisikoInternal();
}

function hitungManajemenRisiko() {
    hitungManajemenRisikoInternal();
}

function hitungManajemenRisikoInternal() {
    const balance = ambilAngka('blibe-pa-balance');
    const riskPct = parseFloat(document.getElementById('blibe-pa-risk-pct').value) || 0;
    const entry = ambilAngka('blibe-pa-entry');
    const tpPrice = ambilAngka('blibe-pa-tp-price');
    const slPrice = ambilAngka('blibe-pa-sl-price');
    
    const rrEl = document.getElementById('blibe-res-rr');
    const riskCashEl = document.getElementById('blibe-res-risk-cash');
    const posSizeEl = document.getElementById('blibe-res-pos-size');

    if (balance <= 0 || entry <= 0 || slPrice <= 0 || slPrice >= entry) {
        rrEl.innerText = "1 : 0.0";
        rrEl.className = "blibe-text-danger";
        riskCashEl.innerText = "Rp 0";
        posSizeEl.innerText = slPrice >= entry && entry > 0 ? "SL Harus < Entry" : "Rp 0";
        return;
    }

    const jarakSL = entry - slPrice;
    const jarakTP = Math.max(0, tpPrice - entry);
    const rasioReward = jarakSL > 0 ? (jarakTP / jarakSL).toFixed(1) : 0;
    
    rrEl.innerText = "1 : " + rasioReward;
    rrEl.className = parseFloat(rasioReward) < 1.5 ? "blibe-text-danger" : "blibe-text-success";

    const slPctReal = (jarakSL / entry) * 100;
    const riskCash = balance * (riskPct / 100);
    const positionSize = riskCash / (slPctReal / 100);
    const formatRupiah = (angka) => "Rp " + Math.round(angka).toLocaleString('id-ID');

    riskCashEl.innerText = formatRupiah(riskCash);
    posSizeEl.innerText = positionSize > balance ? formatRupiah(balance) + " (Max)" : formatRupiah(positionSize);
}

function resetPriceActionPro() {
    setAngkaFormat('blibe-pa-spot-r', 0);
    setAngkaFormat('blibe-pa-spot-s', 0);
    setAngkaFormat('blibe-c1-open', 0);
    setAngkaFormat('blibe-c1-close', 0);
    setAngkaFormat('blibe-c2-open', 0);
    setAngkaFormat('blibe-c2-high', 0);
    setAngkaFormat('blibe-c2-low', 0);
    setAngkaFormat('blibe-c2-close', 0);
    setAngkaFormat('blibe-pa-balance', 10000000);
    setAngkaFormat('blibe-pa-entry', 0);
    setAngkaFormat('blibe-pa-tp-price', 0);
    setAngkaFormat('blibe-pa-sl-price', 0);
